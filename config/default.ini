[base]
env_name = None

# Multi-GPU (single GPU defaults)
gpu_offset = 0

profile = 0
checkpoint_dir = checkpoints
log_dir = logs
checkpoint_interval = 500
eval_episodes = 10000
eval_agents = -1
load_model_path = 'None'
load_enemy_model_path = 'None'
run_id = 'None'
result_fd = 0
# 1 = write <log_dir>/<env>/<run_id>/{config.ini,events.out.tfevents.*} for TensorBoard;
# one scalar row (every dashboard key) per dashboard refresh with new episode stats.
tensorboard = 0
# Set by the sweep parent when sweep.tensorboard=1; groups trial TensorBoard runs.
sweep_id = 'None'

# CUDA graphs (first real rollout/train use). >=0 enable, -1 disable.
cudagraphs = 1
seed = 73
# If true, zero RNN state every horizon (ablation). If false (default carry),
# state persists across horizons and resets only on terminal.
reset_every_horizon = 0

# Cleanba-style learner/actor pipelining: rollouts use a one-epoch-stale actor
# snapshot while the learner trains the previous horizon. Works with carry
# (reset_every_horizon=0) via per-slot initial_states.
async = 1

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 8
# CPU envs, multi-socket hosts. 0 = off. 1 = place the pinned obs/action/reward buffers
# (cudaMemcpyAsync source/dest) on the GPU's NUMA node so DMA stays on that socket's PCIe
# lanes. 2 = also bind all env/copy threads to that node (limits envs to one socket's cores).
numa_bind = 0
# Total policies including trainable policies[0]. 1 = train only.
num_policies = 1
# Required > 0 when num_policies > 1 (historical opponent arch).
hist_policy_hidden_size = 0
hist_policy_num_layers = 0
# Fraction of envs (0–1) assigned to historical policies when num_policies > 1.
hist_policy_percent = 0

# Selfplay-pool training. When enabled, hist_policy_percent of agent slots (see
# [vec]) play against older checkpoints from the current run. Opponents are
# resampled from the pool every opp_timeout_steps global steps (0 = never).
# At end of train, final policy scoring (first match wins):
#   eval_bot_games > 0 → mean env/perf vs the eval_bots ladder (1 Protein point)
#   else eval_games > 0 → mean A winrate vs up to eval_pool_size pool opps
[selfplay]
enabled = 0
max_size = 16
seed = 42
# Resample each historical opponent after this many global steps. 0 = never.
opp_timeout_steps = 500_000_000
eval_pool_size = 8
eval_games = 0
# 0 = off. >0 = after train, eval final vs each bot in eval_bots for this many
# episodes each; mean env/perf becomes TrainResult.score (points=1 for Protein).
eval_bot_games = 0
# Ladder rungs, weakest first: the [env] bot_policy ids the env's header
# defines. Required when eval_bot_games > 0, e.g. eval_bots = 3,4,5,6.
eval_bots = 0

# Per-rung [env] overrides for the bot ladder, as full section.key = value
# lines (e.g. env.dr = 0). Env-owned so core needs no per-env knowledge.
[bot_eval]

# Args used by your env's binding.c go here
[env]
dr = 0
num_agents = 1
num_bots = 0

[policy]
hidden_size = 128
num_layers = 4

[train]
gpus = 1
total_timesteps = 10_000_000
learning_rate = 0.015
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.995
gae_lambda = 0.90
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 2.0
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.001
# Cosine-anneal ent_coef like lr does. Off by default (matches old behavior).
# When on: ent_coef decays from its base value to min_ent_coef_ratio * ent_coef
# over total_timesteps. Useful late in training to let a learned policy commit
# harder on its preferences once the entropy bonus is no longer load-bearing.
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
momentum = 0.95
minibatch_size = 8192
horizon = 64
# vtrace=0: GAE with ρ=1. vtrace=1: puff_advantage clips ρ/c.
vtrace = 0
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0

# Verb-eps exploration floor (experimental, Nethack; see src/algo.cu). 0 = off.
verb_eps = 0.0
verb_eps_anneal_start = 0.4
verb_eps_anneal_end = 1.0

[sweep]
metric = score 
metric_distribution = linear
goal = maximize
max_suggestion_cost = 3600
max_runs = 1200
gpus = -1
downsample = 5
prune_pareto = 1
early_stop_quantile = 0.3
# 1 = show the live dashboard of the trial on GPU slot 0; other trials stay silent.
dashboard = 0
# 1 = TensorBoard sweep tracking (forces base.tensorboard in trials): trials log to
# <log_dir>/<env>/<sweep_id>/<run_id>/ with HParams (swept values, final sweep/score),
# plus a <sweep_id>/_sweep run with per-trial score, best score, failures, params.
tensorboard = 0

# Env-stat panel of the live dashboard. Patterns match stat names without the env/
# prefix and accept * globs, separated by spaces or commas.
# group_<Title> = patterns: adds a titled section (underscores in Title become spaces).
#   Sections render in file order, stats in pattern order; a stat joins the first match.
#   With no group_* keys the panel is the flat list of every stat.
[dashboard]
# Stat columns per row, 1-3.
columns = 2
# Max panel rows (also capped by terminal height). Overflow shows "… N more".
max_rows = 24
# Patterns never shown on the dashboard (still logged to TensorBoard).
hide = ''
# Title of the section for stats matching no group; '' hides them.
ungrouped = Other

;[sweep.train.total_timesteps]
;distribution = log_normal
;min = 3e7
;max = 1e11
;scale = time

;[sweep.policy.hidden_size]
;distribution = uniform_pow2
;min = 32
;max = 1024
;scale = auto

;[sweep.policy.num_layers]
;distribution = uniform
;min = 1
;max = 8
;scale = auto

;[sweep.vec.total_agents]
;distribution = uniform_pow2
;min = 256
;max = 16384
;scale = auto

#[sweep.vec.num_buffers]
#distribution = uniform
#min = 1
#max = 8
#scale = auto

;[sweep.train.horizon]
;distribution = uniform_pow2
;min = 32
;max = 512
;scale = auto

;[sweep.train.minibatch_size]
;distribution = uniform_pow2
;min = 4096
;max = 65536
;scale = auto

;[sweep.train.learning_rate]
;distribution = log_normal
;min = 0.0001
;max = 1.0
;scale = 0.5

;[sweep.train.ent_coef]
;distribution = log_normal
;min = 0.00001
;max = 0.1
;scale = auto

;[sweep.train.gamma]
;distribution = logit_normal
;min = 0.8
;max = 0.9999
;scale = auto

;[sweep.train.gae_lambda]
;distribution = logit_normal
;min = 0.2
;max = 0.995
;scale = auto

;[sweep.train.replay_ratio]
;distribution = uniform
;min = 0.25
;max = 4.0
;scale = auto

# Lower clip is sometimes better but less stable
;[sweep.train.clip_coef]
;distribution = uniform
;min = 0.1
;max = 0.9
;scale = auto

# Optimal vf clip can be lower than 0.1,
# but this results in jank unstable runs
;[sweep.train.vf_clip_coef]
;distribution = uniform
;min = 0.01
;max = 5.0
;scale = auto
;
;[sweep.train.vf_coef]
;distribution = uniform
;min = 0.1
;max = 4.0
;scale = auto
;
;[sweep.train.max_grad_norm]
;distribution = uniform
;min = 0.1
;max = 1.5
;scale = auto
;
;[sweep.train.momentum]
;distribution = logit_normal
;min = 0.5
;max = 0.999
;scale = auto
