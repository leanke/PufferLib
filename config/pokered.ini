[base]
env_name = pokered
checkpoint_dir = checkpoints
checkpoint_interval = 200
cudagraphs = 0

[vec]
total_agents = 256
num_buffers = 4
num_threads = 24

[env]
# Game source behind the shared observe()/reward()/step()/reset() code:
#   "emulator" - Gambatte running the real ROM (default, original behavior)
#   "redcore"  - native C reimplementation (vendor/redcore), thousands of
#                times cheaper per step; train here, eval on "emulator".
# Override with --env.backend=redcore. When "redcore" is selected, the
# [redcore.*] sections at the bottom overlay the matching sections here
# (see src/ini.h puf_ini_apply_backend_presets); anything given on the
# command line still wins over the preset.
backend = "redcore"
num_agents = 1
vec_num_threads = 24
max_episode_length = 20480
rom_path = "pokemon_red.gb"
state_path = "ocean/pokered/states/bulba_start"
headless = True
verbose = False
frameskip = 24
press_frames = 8
audio_enabled = False
# Skip real pixel compositing for every frame in a step's press/release
# block except the last (the only one update_observations() reads). Verified
# byte-identical (differential harness + PPU trace) with a real ~5.5% SPS
# improvement; see docs/vendor-gambatte-libretro.md.
frame_render_skip_enabled = True

full_reset = True
full_reset_prob = 1.00
full_reset_min_blackouts = 1

# Forces a full reset (reload from save state) when the agent hasn't found a
# new tile in this many consecutive steps, even without a blackout. Without
# this, an agent trapped in a trainer-less dead-end (e.g. the small southern
# area right after beating Brock) can only ever hit the max_episode_length
# timeout, which does NOT reload emulator state -- so it stays stuck forever.
stuck_reset_enabled = True
stuck_reset_steps = 4096

# Fill the 160x144 screen segment of the observation (True) or leave it zero
# (False). Must be the same on both backends for a redcore-trained checkpoint
# to be meaningful on the emulator (see .claude/docs/redcore-training.md).
screen_obs_enabled = True

# redcore backend only: which starter the fixed reset state uses
# (BULBASAUR=153, CHARMANDER=176, SQUIRTLE=177 in redcore's species ids), and
# the directory holding tilesets/*.png used to synthesize the screen segment.
fixed_starter_species = 153
assets_dir = "vendor/redcore/assets"

# redcore backend only: after catching a mon that joins the party, ask "Do you
# want to give a nickname?" and open the naming keyboard, like the real game
# (the emulator shows it too). Driven by the same d-pad/A/B buttons: A on YES
# opens the keyboard, B (or NO) declines, B deletes a letter, A on ED submits.
# Catches that overflow to the PC box never prompt. Also read by redcore's own
# config layer (vendor/redcore/src/core/config.c, used by redcore_view) from
# this same file, where [redcore.env] overlays [env]; override on the command
# line with --env.nickname_prompt_enabled=False. False skips the prompt.
nickname_prompt_enabled = True

# redcore backend only: pressing A facing a sign or talking NPC opens its
# dialogue textbox (dismissed with A/B). Also read by redcore_view's config
# layer; override with --env.npc_text_enabled=False. Off for RL so agents
# don't spend steps on flavor text.
npc_text_enabled = False

map_exhaustion_obs_enabled = True
map_exhaustion_norm = 200

pokecenter_visit_steps = 10


disable_wild_until_badge = False
route22_rival_beaten = True
route22_rival_2nd_beaten = False

milestone_sample_prob = 0.75
milestones_enabled = False
event_milestones_enabled = False
town_milestones_enabled = True

exploration_cell_size = 4
weight_exploration_anneal_start = 0
weight_exploration_anneal_end = 0
exploration_death_scaling_enabled = True

weight_exploration = 0.01
weight_catching = 0.10
weight_seeing = 0.10
weight_events = 1.00
weight_leveling = 0.50
weight_healing = 0.00
weight_hm_learned = 0.10
weight_pokecenter = 0.50
weight_pokecenter_visit = 0.001
weight_time = 0.0
weight_death = 0.50
# Penalty paid when the agent runs from a wild battle (0 = off, the old behavior).
weight_run = 1.0

stream_enabled = True
stream_interval = 500
stream_user = "Leanke"
stream_color = "#0D3615"

[train]
total_timesteps = 1_000_000_000
horizon = 128
anneal_lr = False

gamma = 0.998
learning_rate = 0.0014073
minibatch_size = 4096

clip_coef = 0.3
ent_coef = 0.02
gae_lambda = 0.92
max_grad_norm = 0.8229705929037459
vf_clip_coef = 0.5
vf_coef = 3.095843847555002

[sweep]
method = Protein
metric = episode_return
goal = maximize
downsample = 10

# ---- backend = "redcore" presets ------------------------------------------
# Overlay [vec]/[env]/[train] when --env.backend=redcore. redcore has no
# per-frame emulation (one gamestate_step is one meaningful input, no
# frameskip/press_frames), so it sustains far more agents than the emulator;
# the values below are a starting point, not measured. Keep every other key
# the same as the emulator backend: diverging on a reward/observation key
# means the policy trains on a different task than it is evaluated on.
# Emulator-only keys (rom_path, state_path, frameskip, press_frames, audio_*,
# frame_render_skip_enabled, vec_num_threads, milestone_*) are ignored by
# redcore.
[redcore.vec]
total_agents = 256

[redcore.env]
full_reset_prob = 1.00
route22_rival_beaten = False
weight_exploration = 0.50
stream_interval = 8000

[redcore.train]
horizon = 128
minibatch_size = 4096
