[base]
env_name = pokered

[vec]
total_agents = 48
num_buffers = 4
num_threads = 12

[env]
num_agents = 1
rom_path = "pokemon_red.gb"
state_path = "ocean/pokered/states/bulba_start"
headless = True
frameskip = 24
press_frames = 8
max_episode_length = 7680
full_reset = True
disable_wild_until_badge = False
verbose = False
; match the number of threads in the vec section
vec_num_threads = 12

weight_exploration = 0.10
weight_catching = 0.50
weight_seeing = 0.50
weight_events = 1.00
weight_leveling = 0.10
weight_healing = 1.00
weight_time = 0.0

stream_enabled = False
stream_interval = 500
stream_user = "User"
stream_color = "#368896"

[train]
total_timesteps = 100_000_000
horizon = 128
anneal_lr = True

gamma = 0.998
learning_rate = 0.0014073
minibatch_size = 2048

clip_coef = 0.3
ent_coef = 0.02
gae_lambda = 0.92
max_grad_norm = 0.8229705929037459
vf_clip_coef = 0.5
vf_coef = 3.095843847555002

[sweep]
method = Protein
metric = episode_return
goal = maximize
downsample = 10
