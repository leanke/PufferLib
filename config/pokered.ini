[base]
env_name = pokered
checkpoint_dir = checkpoints
checkpoint_interval = 200
cudagraphs = 1
eval_episodes = 500
tensorboard = 1
# .bin path or 'latest'. eval/match: weights to play. train: warm-start weights only
# (optimizer, step and schedules start fresh); size must match [policy].
load_model_path = 'None'

[vec]
total_agents = 512
num_buffers = 4
num_threads = 16
numa_bind = 1

[policy]
hidden_size = 256
num_layers = 2

[train]
;total_timesteps = 200_000_000
total_timesteps = 5_000_000_000

horizon = 256
anneal_lr = True

gamma = 0.994
learning_rate = 0.00233491999
minibatch_size = 4096

clip_coef = 0.25050512
ent_coef = 7.4852047e-05
gae_lambda = 0.957092524
max_grad_norm = 1.5
vf_clip_coef = 4.42358017
vf_coef = 0.404548377
replay_ratio = 1.5464201
momentum = 0.790483534

[dashboard]
max_rows = 80
group_Episode = episode_length episode_extensions perf progress event_sum progress_gained badges episode_return
group_Exploration = pokedex_seen unique_coords pokedex_owned
group_Party = party_count level_sum pkmn*_lvl
group_Reward_Signals = *_signal

[env]
# backend: 
#   "emulator" - Gambatte running the real ROM
#   "native"   - C port 
# text_speed: 1 fast / 2 medium / 3 slow; 
# battle_animation: 1 on / 2 off; 
# battle_style: 1 shift / 2 set.
# milestone_extend_episode: max_episode_length scales by (1 + milestones held): badges, plus key items
#   when milestone_key_items.
# hm_actions: actions 8-12 run Cut/Fly/Surf/Strength/Flash through the Start menu in one step,
#   unmasked only when usable (badge, a mon knows it, overworld, facing a tree/water, ...);
#   Fly stops on the town map. False masks them. The action head always has 13 outputs.
# render_panel: render window gets a panel under the game showing the party (species, level, HP,
#   status), the last step's reward with its per-signal breakdown and episode totals, and the
#   selected action (masked actions dimmed, blocked choice outlined red).

backend = "native"
num_agents = 1
vec_num_threads = 16
max_episode_length = 32768
rom_path = "pokemon_red.gb"
state_path = "ocean/pokered/states/bulba_start"
;state_path = "ocean/pokered/states/start"
pkstate_cache_enabled = True
headless = True
verbose = False
render_panel = False
frameskip = 24
press_frames = 8

event_reward_once = True
rng_randomize_on_reset = True
full_reset = True
start_select_enabled = True
hm_actions = True

text_speed = 1
battle_animation = 2
battle_style = 2
exploration_cell_size = 4

stream_enabled = True
stream_interval = 5000
stream_window = 0
stream_agents = 0
stream_trainer_class = False
stream_sprites = False
stream_color_progress = False
stream_user = "Leanke"
stream_color = "#004400"
;stream_url = "wss://transdimensional.xyz/broadcast"
stream_url = "ws://localhost:3344/broadcast"
stream_async = True
stream_connections = 1
stream_queue_mb = 64

milestone_key_items = True
milestone_extend_episode = True

weight_exploration = 0.0085
weight_catching = 1
weight_seeing = 0.1
weight_leveling = 0.0625
weight_events = 1.00
weight_death = -0.2
weight_battling = 0.005
weight_fleeing = -1.0
weight_healing = 0.50
weight_item_used = 0.50


healing_health_left = 0.50
healing_pp_left = 0.75
weight_hm = 1.0
hm_use_cap = 5

flee_exempt_ghost = True
weight_ghost_stall = -0.03
weight_key_items = 1.0
weight_badges = 1.0
blackout_clear_visited = True

# obs_progress_gating: the 14 story-progress obs bits swap 5 that repeat key-item bits (Parcel,
# SS Ticket, HM01, Poke Flute, HM03) for route gates (parcel delivered, Rocket Hideout found, ghost
# Marowak, either Snorlax). Same obs size; policies trained with the other setting misread 5 bits.
obs_progress_gating = True


# ---- backend sections ------------------------------------------------------
[emulator.env]
audio_enabled = False
frame_render_skip_enabled = True
warmup_frames = 3

[native.env]
; fast_mode: 0 = gamestate, 1 = no render, 2 = no audio, 3 = no render + no audio
stream_interval = 4000
stream_window = 0
stream_agents = 512
stream_trainer_class = True
stream_sprites = True
stream_color_progress = True
fast_mode = 3
screen_half_enabled = True
decision_step_enabled = False
decision_max_frames = 3600
auto_text_enabled = False









# ---- sweep sections ------------------------------------------------------

[sweep]
method = Protein
metric = progress
goal = maximize
downsample = 10
metric_distribution = linear
max_suggestion_cost = 3600
max_runs = 500
gpus = -1
prune_pareto = 1
early_stop_quantile = 0.3
tensorboard = 1

