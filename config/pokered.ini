[base]
env_name = pokered
checkpoint_dir = checkpoints
checkpoint_interval = 200

[vec]
total_agents = 256
num_buffers = 4
num_threads = 24

[env]
num_agents = 1
vec_num_threads = 24
max_episode_length = 20480
rom_path = "pokemon_red.gb"
state_path = "ocean/pokered/states/bulba_start"
headless = True
verbose = False
frameskip = 24
press_frames = 8

full_reset = True
full_reset_prob = 0.50
full_reset_min_blackouts = 1

map_exhaustion_obs_enabled = True
map_exhaustion_norm = 200

disable_wild_until_badge = False
route22_rival_beaten = True
route22_rival_2nd_beaten = False

milestone_sample_prob = 0.5
milestones_enabled = True
event_milestones_enabled = False
town_milestones_enabled = True

exploration_cell_size = 4
weight_exploration_anneal_start = 0
weight_exploration_anneal_end = 0

weight_exploration = 0.10
weight_catching = 0.00
weight_seeing = 0.50
weight_events = 0.50
weight_leveling = 0.50
weight_healing = 0.10
weight_hm_learned = 0.00
weight_pokecenter = 0.50
weight_pokecenter_visit = 0.00
weight_time = 0.0
weight_death = 0.20

stream_enabled = True
stream_interval = 500
stream_user = "Leanke"
stream_color = "#0D3615"

[train]
total_timesteps = 1_000_000_000
horizon = 256
anneal_lr = True

gamma = 0.998
learning_rate = 0.0014073
minibatch_size = 4096

clip_coef = 0.3
ent_coef = 0.02
gae_lambda = 0.92
max_grad_norm = 0.8229705929037459
vf_clip_coef = 0.5
vf_coef = 3.095843847555002

[sweep]
method = Protein
metric = episode_return
goal = maximize
downsample = 10
