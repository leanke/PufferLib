[base]
env_name = pokered
checkpoint_dir = checkpoints
checkpoint_interval = 200
cudagraphs = 0

[vec]
total_agents = 256
num_buffers = 4
num_threads = 24

[env]
# Game source behind the shared observe()/reward()/step()/reset() code:
#   "emulator" - Gambatte running the real ROM (default, original behavior)
#   "redcore"  - native C reimplementation (vendor/redcore), thousands of
#                times cheaper per step; train here, eval on "emulator".
#   "native"   - C port of the pokered disassembly (vendor/pokered-native) that keeps
#                the game's WRAM layout and runs the real game logic frame by frame
#                (same start state, 24 frames per step); much cheaper than the emulator.
# Backends register themselves when linked in, so a new one is selected by its name here
# (see .claude/docs/adding-backend.md); build.sh --no-redcore/--no-native leave one out.
# Override with --env.backend=redcore (or native). When a backend is selected, its
# [<backend>.*] sections at the bottom overlay the matching sections here
# (see src/ini.h puf_ini_apply_backend_presets); anything given on the
# command line still wins over the preset.
backend = "redcore"
num_agents = 1
vec_num_threads = 24
max_episode_length = 20480
rom_path = "pokemon_red.gb"
# Start state shared by every backend. Either a Gambatte save state (the emulator resumes it
# as-is; redcore/native use its converted "<state_path>.pkstate") or a backend-neutral
# ".pkstate" (RAM only: redcore/native, not the emulator). `./convert_state in.state` makes
# one explicitly; the S key in the render window saves a .pkstate from backends that can.
state_path = "ocean/pokered/states/bulba_start"
# Cache a converted Gambatte state as "<state_path>.pkstate" so redcore/native start without
# booting the emulator next time (and without the ROM). The cache is checked against the
# state's hash, so editing the state never serves a stale one. False converts on every start.
pkstate_cache_enabled = True
headless = True
verbose = False
frameskip = 24
press_frames = 8

# Episode end (max_episode_length) reloads the start state. False keeps playing
# from the current state with fresh episode stats.
full_reset = True

# Fill the 80x72 screen segment of the observation (True) or leave it zero
# (False). Must be the same on both backends for a redcore-trained checkpoint
# to be meaningful on the emulator (see .claude/docs/redcore-training.md).
screen_obs_enabled = True


# Logging only (the map_exhaustion stat): visits to the current map at which it reads 1.0.
map_exhaustion_norm = 200

disable_wild_until_badge = False
route22_rival_beaten = False
route22_rival_2nd_beaten = False


# Reward = exploration + catching + seeing + leveling + events + battling - death.
# Exploration pays on the first visit to each exploration_cell_size^2 cell and
# is divided by (blackouts + 1) when exploration_death_scaling_enabled.
exploration_cell_size = 4
exploration_death_scaling_enabled = True

weight_exploration = 0.30
weight_catching = 1.00
weight_seeing = 1.00
weight_leveling = 1.00
# Flat reward per newly completed event (story and trainer alike).
weight_events = 1.00
weight_death = 0.50
# Paid once when a battle ends with the enemy fainted and the party alive.
weight_battling = 0.01
# Penalty (subtracted) each time the agent escapes a battle with Run; 0 disables it, which
# keeps the previous behavior. Override with --env.weight_fleeing=0.1. A caught Pokemon, a
# win and a loss are not escapes. On the emulator an enemy Roar/Whirlwind/Teleport that
# ends the battle also sets the game's escape flag and is penalized the same way.
weight_fleeing = 0.1

stream_enabled = True
stream_interval = 500
stream_user = "Leanke"
stream_color = "#0D3615"

[train]
total_timesteps = 1_000_000_000
horizon = 128
anneal_lr = False

gamma = 0.998
learning_rate = 0.0014073
minibatch_size = 8192

clip_coef = 0.3
ent_coef = 0.02
gae_lambda = 0.92
max_grad_norm = 0.8229705929037459
vf_clip_coef = 0.5
vf_coef = 3.095843847555002

# ---- backend sections ------------------------------------------------------
# --env.backend=<name> overlays [<name>.vec]/[<name>.env]/[<name>.train] on top of the
# sections above (see src/ini.h puf_ini_apply_backend_presets); anything given on the
# command line still wins. Keys only one backend understands live in that backend's
# [<name>.env]; [env] holds only settings every backend honours, so a policy trained under
# one backend sees the same reward/observation/world settings on the others. A key that
# a backend does not read is simply ignored, so the sections never leak across backends.
# Add a key to a backend's own section only for a real, unavoidable backend difference.

# ---- emulator (Gambatte running the real ROM) ------------------------------
# Also read from [env] by the emulator: rom_path, state_path (a Gambatte save state),
# headless, frameskip, press_frames, vec_num_threads (its Gambatte pool size).
[emulator.vec]

[emulator.env]
# Gambatte audio. Off for training (the library has no audio sink when headless).
audio_enabled = False

# Skip real pixel compositing for every frame in a step's press/release
# block except the last (the only one update_observations() reads). Verified
# byte-identical (differential harness + PPU trace) with a real ~5.5% SPS
# improvement; see docs/vendor-gambatte-libretro.md.
frame_render_skip_enabled = True

# Milestone resets: restart episodes from states captured at map/event milestones.
# milestones_enabled is the master switch; the event/town flags pick what is captured.
# milestone_sample_prob is the chance a reset resumes a captured milestone instead of
# the start state. Native and redcore have no milestone capture (the core warns if
# milestones_enabled is set on them).
milestone_sample_prob = 0.75
milestones_enabled = False
event_milestones_enabled = False
town_milestones_enabled = True

[emulator.train]

# ---- redcore (native C reimplementation, vendor/redcore) -------------------
# Also read from [env] by redcore: state_path (a .pkstate), pkstate_cache_enabled,
# frameskip (its NPC time per step), screen_obs_enabled. rom_path is only needed to convert a
# Gambatte state. headless, audio_enabled and the emulator-only keys are ignored.
# vendor/redcore/src/core/config.c (used by redcore_view) reads the three toggles below
# from this file, with [redcore.env] overlaying [env].
[redcore.vec]

[redcore.env]
# redcore backend only: its start state (position, party, bag, money, pokedex,
# events) is decoded at startup from the same .pkstate the native backend loads, i.e. the
# emulator's RAM at reset (see state_path above and ocean/pokered/pkstate.h).
# fixed_starter_species swaps the captured starter for another one at the same
# level (BULBASAUR=153, CHARMANDER=176, SQUIRTLE=177 in redcore's species ids);
# leave it at the captured species to match the emulator exactly. assets_dir is
# the directory holding tilesets/*.png used to synthesize the screen segment.
fixed_starter_species = 153
assets_dir = "vendor/redcore/assets"

# redcore backend only: after catching a mon that joins the party, ask "Do you
# want to give a nickname?" and open the naming keyboard, like the real game
# (the emulator shows it too). Driven by the same d-pad/A/B buttons: A on YES
# opens the keyboard, B (or NO) declines, B deletes a letter, A on ED submits.
# Catches that overflow to the PC box never prompt. Also read by redcore's own
# config layer (vendor/redcore/src/core/config.c, used by redcore_view) from
# this same file, where [redcore.env] overlays [env]; override on the command
# line with --env.nickname_prompt_enabled=False. False skips the prompt.
nickname_prompt_enabled = True

# redcore backend only: pressing A facing a sign or talking NPC opens its
# dialogue text box (A/B advances it), like the real game. False (default)
# ignores those interactions, so text boxes never appear. Must match between
# training and evaluation on the emulator, which always shows NPC text.
npc_text_enabled = True

# redcore backend only: WALK NPCs wander like the real game (random direction and delay, the
# original's collision and range quirks), STAY NPCs turn in place, and trainers lined up with
# the player spot them whenever NPCs have moved. Each overworld step runs `frameskip` frames
# of NPC time, matching the emulator. False freezes every NPC on its spawn tile and facing.
npc_movement_enabled = True

# redcore backend only: draw the battle screen like the real game -- the game's own font and
# HUD tiles for the names, levels, HP bars and numbers, the FIGHT/PKMN/ITEM/RUN menu and the
# FIGHT move list with its TYPE/PP box, and the pics at the emulator's positions (the main
# and FIGHT menus are pixel-identical to the emulator). False (default) keeps the old schematic
# bars and boxes. The bag, party and safari screens are still schematic either way. Must match
# between training and evaluation: a policy trained on one battle screen does not transfer to
# the other, and only the real UI transfers to the emulator. Regenerate the tile/name tables
# with `python3 ocean/pokered/tools/gen_battle_gfx.py`.
real_battle_ui_enabled = True

# redcore backend only: play battle messages like the real game. The engine resolves a turn in one
# step, the emulator spends roughly 8-20 agent steps on it: the battle opening ("Wild X appeared!",
# "Go! X!"), "X used MOVE!", "Critical hit!", "It's super effective!", misses, faints, EXP/level-up,
# trainer sent out/defeated/prize money, switch/item/ball/run messages. Most boxes pass by
# themselves (buttons do nothing); the ones ending in the blinking arrow wait for A or B; "Use
# next POKeMON?" takes A/B (up/down move its cursor). The policy's observations follow the frames
# (battle HP/level only changes when the frame shows it; everything else updates when the phase
# ends). Implies the real battle UI. False (default) keeps one-step turns. Costs many more steps per
# battle, so retune horizon/step budgets, and train and evaluate with the same setting.
battle_text_enabled = False

stream_interval = 6000

[redcore.train]

# ---- native (C port of the pokered disassembly, vendor/pokered-native) -----
# Loads the start state from the .pkstate (see state_path) into the game's WRAM and runs
# the real game logic frame by frame. Also read from [env]: state_path,
# pkstate_cache_enabled, frameskip, press_frames (frames per step), screen_obs_enabled,
# and the scenario toggles (disable_wild_until_badge, route22_rival_*). rom_path is only
# needed to convert a Gambatte state. headless and audio_enabled (the library has no
# audio output), frame_render_skip_enabled, milestone_* and the redcore-only keys are ignored.
[native.vec]

[native.env]
stream_interval = 6000

# Max-speed settings of pokered-native. Every key defaults to the plain game stepped
# `frameskip` frames at a time with the full screen, so existing runs are unchanged.
#
# Fast game mode (pokered_set_fast_mode), a bit mask:
#   0 = full game (default; matches the emulator frame for frame),
#   1 = no video: skips VRAM/LCD work. The screen observation becomes all zeros, so set
#       screen_obs_enabled=False with it. WRAM is identical to the full mode.
#   2 = no audio: skips the audio engine. Waits for sounds end at once, so the game takes
#       fewer frames and frame-driven RNG diverges from the emulator. Fine with screen obs.
#   3 = both. Use it when screen_obs_enabled=False.
fast_mode = 2

# Screen observation through POKERED_SCREEN_HALF (each 2x2 block drawn as one byte of four
# shades) and a 256-entry lookup table, instead of drawing the full frame and downsampling.
# Gives exactly the same observation, much cheaper. The render window still gets full frames.
# With screen_obs_enabled=False the screen is never drawn at all.
screen_half_enabled = True

# Step until the game next needs a real choice (pokered-native's POKERED_STEP_DECISION)
# instead of running `frameskip` frames: a cutscene fits in one step. press_frames is how
# long the button is held; decision_max_frames caps one step. Changes the meaning of a step
# (frames per step vary), so it must match between training and evaluation and no longer
# matches the emulator frame for frame.
decision_step_enabled = False
decision_max_frames = 3600

# With decision_step_enabled: continue-only text waits (the "more" arrows, battle messages)
# are answered with A by the env, so they cost no actions. Menus, YES/NO and the battle menus
# still go to the agent.
auto_text_enabled = False

# Red's OPTION menu as the game stores it at the start state and after every reset. 0 leaves
# the start state's setting. text_speed: 1 fast, 2 medium, 3 slow. battle_animation: 1 on,
# 2 off. battle_style: 1 shift, 2 set. text_speed=1 and battle_animation=2 are the fast
# choices.
text_speed = 1
battle_animation = 2
battle_style = 2

# Not wired to this file yet (pokered-native api.h / rl.h): the screen format beyond HALF,
# text_scroll, a_mash and the reward presets of its own RL env. Adding one means reading it
# with pk_opt_*() in nat_create (see docs/adding-feature.md) and listing it here.
#
# Throughput: [vec] num_threads should be the number of physical cores and total_agents a
# multiple of it, so each thread steps several envs. Resets reload the start state in
# microseconds. Build with ./build.sh (LTO, -O3, -march=native; NATIVE_MARCH=0 for a
# portable binary).

[native.train]

[sweep]
method = Protein
metric = episode_return
goal = maximize
downsample = 10

metric_distribution = linear
max_suggestion_cost = 3600
max_runs = 500
gpus = -1
prune_pareto = 1
early_stop_quantile = 0.3

; [sweep.train.total_timesteps]
; distribution = log_normal
; min = 3e7
; max = 1e11
; scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
max = 1024
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
max = 8
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 256
max = 1024
scale = auto

#[sweep.vec.num_buffers]
#distribution = uniform
#min = 1
#max = 8
#scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 512
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 2048
max = 32768
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 1.0
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.1
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.9900
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.2
max = 0.995
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.25
max = 4.0
scale = auto

# Lower clip is sometimes better but less stable
[sweep.train.clip_coef]
distribution = uniform
min = 0.1
max = 0.9
scale = auto

# Optimal vf clip can be lower than 0.1,
# but this results in jank unstable runs
[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.01
max = 5.0
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 4.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.1
max = 1.5
scale = auto

[sweep.train.momentum]
distribution = logit_normal
min = 0.5
max = 0.999
scale = auto
