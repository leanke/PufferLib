[base]
env_name = pokered
checkpoint_dir = checkpoints
checkpoint_interval = 200
; cudagraphs: any value >= 0 enables CUDA graphs, -1 disables
cudagraphs = 1
eval_episodes = 500
; TensorBoard scalars + config in logs/pokered/<run_id>/ (see default.ini)
tensorboard = 0

[vec]
total_agents = 512
num_buffers = 4
num_threads = 24
numa_bind = 1

[policy]
hidden_size = 256
num_layers = 2

[train]
;total_timesteps = 41_943_040
total_timesteps = 1_000_000_000

horizon = 256
anneal_lr = False

gamma = 0.99297899
learning_rate = 0.00294050504
minibatch_size = 4096

clip_coef = 0.519878387
ent_coef = 0.00029684999
gae_lambda = 0.948465586
max_grad_norm = 1.47205305
vf_clip_coef = 5
vf_coef = 0.741736114
replay_ratio = 1.77001274
momentum = 0.902894437

[env]
# backend: 
#   "emulator" - Gambatte running the real ROM
#   "native"   - C port 
# text_speed: 1 fast / 2 medium / 3 slow; 
# battle_animation: 1 on / 2 off; 
# battle_style: 1 shift / 2 set.
# milestone_progress_bias: weighted exp(bias * completed_events / 100),
# obs_info_enabled: map id, tileset id, badge bits and facing direction (zeros when off)
# obs_progress_enabled: one bit per story event in pokered_progress.h (Bill, SS Anne, Rocket Hideout,
#   Pokemon Tower, Silph Co, Elite 4, ...) (zeros when off; needs obs_info_enabled)
# obs_moves_enabled: move id per move slot for party and battle mons, in move-menu order (zeros when off)
# obs_mon_detail_enabled: status byte and per-move PP fraction per mon (zeros when off)
# obs_item_context_enabled: per bag slot a "using it now has an effect" flag and a "bag cursor is on
#   this slot" flag, and per party mon a bitmask of bag HMs it can learn but does not know (zeros when off)
backend = "native"

num_agents = 1
vec_num_threads = 24
max_episode_length = 20480
rom_path = "pokemon_red.gb"
state_path = "ocean/pokered/states/bulba_start"
pkstate_cache_enabled = True
headless = True
verbose = False
frameskip = 24
press_frames = 8

disable_wild_until_badge = False
route22_rival_beaten = False
route22_rival_2nd_beaten = False
; weight_item_used pays every proper use of an item outside battle: an HM taught, a TM taught,
; and an HM used in the field (Cut, Surf, Strength, Flash, Fly) are always included
hm_used_once = True
; pay a TM teach (move learned + TM item consumed)
tm_taught_enabled = True
; pay each HM teach once per episode (off: every relearn pays, so two HMs can be swapped forever)
hm_taught_once = False
; pay healing/cure/revive/PP items (fraction of HP or PP restored, 1 otherwise), Rare Candy and
; evolution stones, only when the item is consumed and its effect shows up within 64 steps
item_used_consumables_enabled = True
; pay the first Bicycle ride and each Poke Flute that wakes a Snorlax, once per episode
; (the "Fight Route12/16 Snorlax" events then stop paying weight_events)
item_used_key_items_enabled = True
event_reward_once = True
rng_randomize_on_reset = True
full_reset = True
obs_info_enabled = True
obs_progress_enabled = True
obs_moves_enabled = True
obs_mon_detail_enabled = True
obs_item_context_enabled = True
exploration_death_scaling_enabled = True
start_select_enabled = True

text_speed = 1
battle_animation = 2
battle_style = 2
exploration_cell_size = 4
map_exhaustion_norm = 200

stream_enabled = True
stream_interval = 500
stream_user = "Leanke"
stream_color = "#0D3615"
; stream_url = "wss://transdimensional.xyz/broadcast"
stream_url = "ws://localhost:3344/broadcast"
; stream_async: send from one background thread instead of blocking the env step on network I/O
stream_async = True
; stream_connections (async only): 0 = one websocket per env, N = envs share N websockets
stream_connections = 1
; stream_queue_mb (async only): pending-message budget; oldest messages are dropped beyond it
stream_queue_mb = 64

milestones_enabled = True
milestone_reset_prob = 0.50
milestone_states_per_slot = 10
milestone_progress_bias = 0

weight_exploration = 0.05
weight_catching = 1.00
weight_seeing = 1.00
weight_leveling = 1.00
weight_events = 1.50
weight_death = -0.02
weight_battling = 0.01
weight_fleeing = -0.87
weight_healing = 1.00
healing_health_left = 0.86
healing_pp_left = 0.84
weight_item_used = 2.00


;weight_exploration = 0.065897633
;weight_catching = 5.00000095
;weight_seeing = 1.0
;weight_leveling = 0.565225124
;weight_events = 1.22024763
;weight_death = -0.0278162956
;weight_battling = 0.0149373189
;weight_fleeing = -0.877583742
;weight_healing = 2.0
;healing_health_left = 0.861694872
;healing_pp_left = 0.844573259
;weight_item_used = 1.59746504


# ---- backend sections ------------------------------------------------------
[emulator.env]
audio_enabled = False
frame_render_skip_enabled = True
warmup_frames = 3

[native.env]
; fast_mode: 0 = gamestate, 1 = no render, 2 = no audio, 3 = no render + no audio
stream_interval = 6000
fast_mode = 3
screen_half_enabled = True
decision_step_enabled = False
decision_max_frames = 3600
auto_text_enabled = False


# ---- sweep sections ------------------------------------------------------

[sweep]
method = Protein
metric = progress
goal = maximize
downsample = 10
metric_distribution = linear
max_suggestion_cost = 3600
max_runs = 500
gpus = -1
prune_pareto = 1
early_stop_quantile = 0.3
tensorboard = 1

