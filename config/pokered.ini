[base]
env_name = pokered
checkpoint_dir = checkpoints
checkpoint_interval = 200
cudagraphs = 0
eval_episodes = 500

[vec]
total_agents = 1024
num_buffers = 4
num_threads = 24

[policy]
hidden_size = 512
num_layers = 2.08359504

[train]
total_timesteps = 1_000_000_000
horizon = 128
anneal_lr = False

gamma = 0.998001099
learning_rate = 0.00303901127
minibatch_size = 4096

clip_coef = 0.392286658
ent_coef = 0.000863501453
gae_lambda = 0.770592332
max_grad_norm = 1.5
vf_clip_coef = 5
vf_coef = 2.0223856
replay_ratio = 2.38375854
momentum = 0.689614296

[env]
# backend: 
#   "emulator" - Gambatte running the real ROM
#   "native"   - C port 
# obs_mode:
#   "screen" - 80x72 grayscale of the frame (previous behavior), conv encoder in pokered.cu
#   "tiles"  - the game's own 20x18 tile map (wTileMap, text and menus included) plus a 20x18
# text_speed: 1 fast / 2 medium / 3 slow; 
# battle_animation: 1 on / 2 off; 
# battle_style: 1 shift / 2 set.
# milestone_progress_bias: weighted exp(bias * completed_events / 100),
backend = "native"
obs_mode = "tiles"

num_agents = 1
vec_num_threads = 24
max_episode_length = 20480
rom_path = "pokemon_red.gb"
state_path = "ocean/pokered/states/bulba_start"
pkstate_cache_enabled = True
headless = True
verbose = False
frameskip = 24
press_frames = 8

disable_wild_until_badge = False
route22_rival_beaten = False
route22_rival_2nd_beaten = False
hm_used_once = True
event_reward_once = True
rng_randomize_on_reset = False
full_reset = True
screen_obs_enabled = False
exploration_death_scaling_enabled = True
start_select_enabled = True

text_speed = 1
battle_animation = 2
battle_style = 2
exploration_cell_size = 4
map_exhaustion_norm = 200

stream_enabled = True
stream_interval = 500
stream_user = "Leanke"
stream_color = "#0D3615"

milestones_enabled = True
milestone_reset_prob = 0.66
milestone_states_per_slot = 10
milestone_progress_bias = 0

weight_exploration = 0.20
weight_catching = 1.00
weight_seeing = 1.00
weight_leveling = 1.00
weight_events = 1.00
weight_death = -0.30
weight_battling = 0.01
weight_fleeing = -1.0
weight_healing = 1.0
healing_health_left = 0.75
healing_pp_left = 0.75
weight_hm_taught = 1.0
weight_hm_used = 1.0


# ---- backend sections ------------------------------------------------------
[emulator.env]
audio_enabled = False
frame_render_skip_enabled = True
warmup_frames = 3

[native.env]
; fast_mode: 0 = gamestate, 1 = no render, 2 = no audio, 3 = no render + no audio
stream_interval = 2000
fast_mode = 3
screen_half_enabled = True
decision_step_enabled = False
decision_max_frames = 3600
auto_text_enabled = False


# ---- sweep sections ------------------------------------------------------

[sweep]
method = Protein
metric = episode_return
goal = maximize
downsample = 10
metric_distribution = linear
max_suggestion_cost = 3600
max_runs = 500
gpus = -1
prune_pareto = 1
early_stop_quantile = 0.3


[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 512
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.9900
max = 0.9999
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 1.0
scale = 0.5

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 2048
max = 32768
scale = auto



